[project]
name = "uplift-modeling"
version = "0.1.0"
description = "Uplift modeling, a Thompson-sampling contact bandit, and guardrailed policy backtesting on synthetic debt-collection data."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    # Notebook tooling (notebooks/uplift_contact_strategy.ipynb)
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
]
